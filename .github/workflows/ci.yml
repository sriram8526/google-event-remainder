name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: bandit -q -r app
      - run: pytest
      - run: pip-audit -r requirements.txt
